name: Reproduce analysis

# Checks the claim the report and the README both make: that a clean checkout
# running the two documented commands regenerates the committed outputs
# unchanged. The site is then published from the same run, so the page a reader
# opens is always the output of a build that passed.
#
# Only the CSVs are compared byte-for-byte. The PNGs are rendered by ggplot2
# against whatever fonts and graphics devices the runner has, so they are not
# byte-reproducible across platforms; asserting that they were would produce a
# permanently red check that says nothing about the analysis. The figures are
# still rendered, so a break in the plotting code fails the job.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only by default. Only the publish job below is granted write, and only
# it needs it: every pull request run, and every push that does not reach
# publishing, now carries a token that cannot alter the repository.
permissions:
  contents: read

# One run per ref. A second push while the first is still rendering used to
# leave two jobs racing for gh-pages, and the slower one won.
# Pull request runs are superseded by the next push to the same branch, so
# cancelling them is free. Pushes to main are not cancelled: that job publishes,
# and cancelling a publisher mid-`quarto publish gh-pages` is both a worse
# outcome than queueing and easier to overlook than a failure.
concurrency:
  group: reproduce-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # quarto publish needs the gh-pages history

      - uses: r-lib/actions/setup-r@465b7d8e732ca3921382b1674c59bada9cbf3399 # v2
        with:
          r-version: renv
          use-public-rspm: true

      - uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2.2.0

      # DESCRIPTION still declares what the analysis uses; renv.lock pins the
      # exact versions those resolve to. The snapshot is 'explicit', so the two
      # cannot drift apart: adding an Import without re-snapshotting fails here.
      - uses: r-lib/actions/setup-renv@465b7d8e732ca3921382b1674c59bada9cbf3399 # v2

      - name: Dependencies and lockfile must stay synchronized
        run: Rscript -e 'stopifnot(isTRUE(renv::status()$synchronized))'

      - name: Verify the pinned extract against its recorded hash
        run: Rscript -e 'source("R/load.R"); check_extract_hash(); cat("hash OK\n")'

      - name: Reject malformed extract fixtures
        run: Rscript tests/test-r-contracts.R

      # Deleted first so the comparison below cannot be satisfied by doing
      # nothing. `git diff --exit-code` compares the worktree against the
      # index, so a checks.R that silently stopped writing — an early exit, a
      # dropped write_csv, a guard that no longer fires — left the committed
      # files untouched and passed. Removing them turns "nothing changed" into
      # "every one of them was rewritten, and matches".
      - name: Regenerate the validation outputs
        run: |
          rm -f outputs/*.csv
          Rscript R/checks.R

      - name: Render the report and the figures
        run: quarto render

      # Scoped to the CSVs, like the diff: `quarto render` also rewrites
      # outputs/figures/*.png, which are deliberately not byte-reproducible
      # across platforms, so a tree-wide check here would be permanently red.
      # --untracked-files so a newly produced CSV that nobody committed is a
      # failure rather than an invisible extra file.
      - name: Committed CSV outputs must match a fresh run
        run: |
          git diff --exit-code -- 'outputs/*.csv'
          test -z "$(git status --porcelain --untracked-files=all -- 'outputs/*.csv')"

  # The Databricks notebooks cannot run here as notebooks, but they can run as
  # Python against a local Spark session, and the claim that they are a port
  # of the same analysis can be checked: every gold table is compared against
  # the CSVs the R job above reproduces. Separate from that job because it
  # needs a JVM and PySpark and nothing else here does.
  port:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      # Pins live in databricks/requirements.txt so Dependabot can see them.
      - name: Install PySpark
        run: python -m pip install --quiet -r databricks/requirements.txt

      - name: Run the notebooks locally and compare every gold table with outputs/*.csv
        run: python databricks/run_local.py

  # Publishing is gated on both jobs above via `needs`, so the live page can
  # only ever be a version that reproduced its own outputs and whose port
  # agrees with them -- the same guarantee as before, now expressed as a
  # dependency rather than as step ordering.
  #
  # A separate job because permissions are granted per job. As one job, every
  # pull request run held a write token it never used; the gate does not need
  # one and the publisher does.
  #
  # `quarto publish gh-pages` renders the project itself, so this repeats the
  # render rather than passing an artifact between jobs. That costs a few
  # minutes on pushes to main and keeps the publisher a single documented
  # command instead of a hand-assembled directory.
  publish:
    needs: [reproduce, port]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write   # pushes the rendered site to the gh-pages branch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # quarto publish needs the gh-pages history

      - uses: r-lib/actions/setup-r@465b7d8e732ca3921382b1674c59bada9cbf3399 # v2
        with:
          r-version: renv
          use-public-rspm: true

      - uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2.2.0

      - uses: r-lib/actions/setup-renv@465b7d8e732ca3921382b1674c59bada9cbf3399 # v2

      - name: Regenerate the validation outputs
        run: Rscript R/checks.R

      - name: Publish to GitHub Pages
        uses: quarto-dev/quarto-actions/publish@8a96df13519ee81fd526f2dfca5962811136661b # v2.2.0
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
