version: 2

# Dependabot has no R ecosystem, so R package versions stay the lockfile's job.
# The workflow actions and the port's Python pins are watched here. Monthly
# keeps the noise low enough to actually read.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5

  - package-ecosystem: pip
    directory: /databricks
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
