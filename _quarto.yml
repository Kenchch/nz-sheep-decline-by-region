project:
  type: website
  output-dir: _site
  # Listed explicitly. Without this Quarto renders every .md in the tree, which
  # published CHANGELOG.html, DATA-LICENCE.html and data-raw/SOURCE.html to the
  # site as orphan pages nothing links to, and would turn the reproducibility
  # gate red over a YAML or link error in an unrelated notes file.
  render:
    - index.qmd

website:
  title: "Where New Zealand's sheep went"
  page-footer:
    center: "Source data: Stats NZ, Agricultural production statistics, licensed by Stats NZ for re-use under the Creative Commons Attribution 4.0 International licence."

format:
  html:
    theme: cosmo
    toc: true
    toc-depth: 2
    number-sections: false
    fig-width: 9
    fig-height: 5.5
    code-fold: true
    code-summary: "Show the code"
    df-print: kable
    embed-resources: false

execute:
  warning: false
  message: false
